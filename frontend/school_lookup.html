<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學區地圖 · 都更神探R</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 14px;
      font-family: -apple-system, "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: #f5f0e3; color: #2d2a23;
    }
    h1 { margin: 0 0 12px; font-size: 20px; }
    .card {
      background: #fff; border: 1px solid #e0d9c2;
      border-radius: 6px; padding: 12px; margin-bottom: 12px;
    }
    .toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    .toolbar label { cursor: pointer; }
    .toolbar input[type=radio] { vertical-align: middle; margin-right: 4px; }
    .toolbar .map-hint { color: #666; font-size: 12px; margin-left: auto; }
    .toolbar .status { color: #c78a00; font-weight: 600; font-size: 13px; }
    .result {
      margin-top: 10px; padding: 10px 14px; background: #f7f3ea;
      border-left: 3px solid #c78a00; border-radius: 4px;
      font-size: 14px; line-height: 1.7;
    }
    .result strong { color: #c78a00; }
    .schools { display: inline-flex; flex-wrap: wrap; gap: 6px; }
    .school-tag {
      display: inline-block; padding: 3px 10px;
      background: #c78a00; color: #fff; border-radius: 12px; font-size: 12px;
    }
    .school-tag.junior { background: #6a8caf; }
    .err { color: #c0392b; }
    #map { height: 78vh; min-height: 480px; border-radius: 4px; border: 1px solid #ddd; }
    .raw {
      margin-top: 6px; font-size: 11px; font-family: Consolas, monospace;
      color: #888; white-space: pre-wrap; word-break: break-all;
    }
    .sd-label {
      background: rgba(255,255,255,0.85);
      border: 1px solid #444;
      border-radius: 3px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
      color: #333;
      white-space: nowrap;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<h1>📚 學區地圖（台北市 + 新北市）</h1>

<div class="card">
  <div class="toolbar">
    <span>顯示：</span>
    <label><input type="radio" name="kind" value="elementary" checked> 國小</label>
    <label><input type="radio" name="kind" value="junior_high"> 國中</label>
    <span class="status" id="status">載入中…</span>
    <span class="map-hint">同色 = 同學校；點任一里看詳細學區</span>
  </div>
  <div id="map" style="margin-top:10px"></div>
  <div id="map-result" class="result" style="display:none;"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

// ── 點地圖任一點顯示該位置學區詳細（rows_detail 含類型/鄰級/跨區）──
function renderResult(el, data) {
  el.style.display = 'block';
  if (data.error) {
    el.innerHTML = `<span class="err">❌ ${esc(data.error)}</span>`;
    return;
  }
  const detail = data.rows_detail || [];
  const queryDistrict = data.district || '';
  const META_STYLE = 'margin-left:4px;color:#64748b;font-size:0.85em;font-weight:400;';
  const detailChip = (d, cls) => {
    const cross = d.school_district && d.school_district !== queryDistrict
      ? esc(d.school_district) + '跨區/' : '';
    const zone = d.zone_type ? esc(d.zone_type) : '';
    const nb = d.neighborhoods_raw ? ' — ' + esc(d.neighborhoods_raw) : '';
    const meta = (cross || zone || nb)
      ? `<span style="${META_STYLE}">(${cross}${zone}${nb})</span>` : '';
    return `<span class="school-tag ${cls||''}">${esc(d.school)}${meta}</span>`;
  };
  const sortDetail = (items) => items.slice().sort((a, b) => {
    const za = a.zone_type === '基本' ? 0 : a.zone_type === '自由' ? 1 : 2;
    const zb = b.zone_type === '基本' ? 0 : b.zone_type === '自由' ? 1 : 2;
    if (za !== zb) return za - zb;
    return String(a.school || '').localeCompare(String(b.school || ''), 'zh-Hant');
  });
  const renderList = (detailItems, fallback, cls) => {
    if (detailItems.length) return sortDetail(detailItems).map(d => detailChip(d, cls)).join(' ');
    if (fallback && fallback.length) return fallback.map(s => `<span class="school-tag ${cls||''}">${esc(s)}</span>`).join(' ');
    return '<span style="color:#888;">—</span>';
  };
  const esItems = detail.filter(d => d.kind === 'elementary');
  const jhItems = detail.filter(d => d.kind === 'junior_high');
  let html = '';
  if (data.geocoded_address) html += `<div>Google 解析：${esc(data.geocoded_address)}</div>`;
  const lat = data.geocoded_lat ?? data.lat, lng = data.geocoded_lng ?? data.lng;
  if (lat != null && lng != null) {
    const fmt = v => typeof v === 'number' ? v.toFixed(6) : String(v);
    html += `<div>座標：${fmt(lat)}, ${fmt(lng)}</div>`;
  }
  if (data.city || data.district) {
    html += `<div>位置：${esc(data.city || '')} ${esc(data.district || '')} <strong>${esc(data.village || '?里')}</strong></div>`;
  }
  html += `<div>國小學區：<span class="schools">${renderList(esItems, data.school_elementary, '')}</span></div>`;
  html += `<div>國中學區：<span class="schools">${renderList(jhItems, data.school_junior_high, 'junior')}</span></div>`;
  if (data.source && data.source !== 'lookup_hit') {
    html += `<div class="raw">source: ${esc(data.source)}</div>`;
  }
  el.innerHTML = html;
}

// ── 同學校永遠同色 ──
function colorForSchool(name) {
  if (!name) return '#888';
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(h) % 360}, 65%, 60%)`;
}

let map, marker, polygonLayer, labelLayer;
let GEO_DATA = null;       // 全部 polygons (FeatureCollection)
let CURRENT_KIND = 'elementary';

function styleForFeature(ft, kind) {
  const schools = ft.properties[kind] || [];
  const main = schools[0] || '';
  return {
    color: '#444', weight: 1.0, opacity: 0.85,
    fillColor: colorForSchool(main),
    fillOpacity: schools.length ? 0.5 : 0.1,
  };
}

function renderPolygons() {
  if (!GEO_DATA) return;
  if (polygonLayer) { map.removeLayer(polygonLayer); polygonLayer = null; }
  if (labelLayer) { map.removeLayer(labelLayer); labelLayer = null; }
  const kind = CURRENT_KIND;
  polygonLayer = L.geoJSON(GEO_DATA, {
    style: (ft) => styleForFeature(ft, kind),
    onEachFeature: (ft, layer) => {
      const p = ft.properties;
      const es = (p.elementary || []).join('、') || '—';
      const jh = (p.junior_high || []).join('、') || '—';
      layer.bindTooltip(
        `<b>${esc(p.village)}</b> (${esc(p.county)}${esc(p.town)})<br>` +
        `國小：${esc(es)}<br>國中：${esc(jh)}`,
        { sticky: true }
      );
      layer.on('mouseover', () => layer.setStyle({ weight: 2.4, fillOpacity: 0.7 }));
      layer.on('mouseout', () => polygonLayer.resetStyle(layer));
    },
  }).addTo(map);
  // label: 每 polygon 中心放主學校名（同學校多 polygon 都會印，先簡單版）
  labelLayer = L.layerGroup();
  GEO_DATA.features.forEach(ft => {
    const schools = ft.properties[kind] || [];
    if (!schools.length) return;
    const center = (() => {
      try { return L.geoJSON(ft).getBounds().getCenter(); } catch (_e) { return null; }
    })();
    if (!center) return;
    const txt = schools.length > 1 ? schools.join('/') : schools[0];
    const ic = L.divIcon({
      className: 'sd-label', html: `<span>${esc(txt)}</span>`, iconSize: null,
    });
    L.marker(center, { icon: ic, interactive: false }).addTo(labelLayer);
  });
  labelLayer.addTo(map);
}

async function loadAllPolygons() {
  const status = $('status');
  status.textContent = '載入學區邊界中…';
  try {
    const r = await fetch('/api/school_district/polygons_all');
    if (!r.ok) { status.textContent = `載入失敗 HTTP ${r.status}`; return; }
    GEO_DATA = await r.json();
    if (GEO_DATA.error) { status.textContent = '載入失敗：' + GEO_DATA.error; return; }
    const n = (GEO_DATA.features || []).length;
    status.textContent = `已載入 ${n} 個里 (${GEO_DATA.features.filter(f => (f.properties.elementary||[]).length).length} 國小有資料)`;
    renderPolygons();
    try { map.fitBounds(polygonLayer.getBounds(), { padding: [20, 20] }); } catch (_e) {}
  } catch (err) {
    status.textContent = '載入失敗：' + err.message;
  }
}

function initMap() {
  map = L.map('map').setView([25.05, 121.55], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OSM', maxZoom: 19,
  }).addTo(map);
  L.tileLayer('https://wmts.nlsc.gov.tw/wmts/B0727/default/EPSG:3857/{z}/{x}/{y}', {
    attribution: '村里界 © 內政部 NLSC', maxZoom: 19, opacity: 0.25,
  }).addTo(map);
  map.on('click', async (e) => {
    const { lat, lng } = e.latlng;
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map);
    const out = $('map-result');
    out.style.display = 'block';
    out.innerHTML = `查詢中… (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
    try {
      const r = await fetch(`/api/school_district/lookup?lat=${lat}&lng=${lng}`);
      if (!r.ok) { out.innerHTML = `<span class="err">HTTP ${r.status}</span>`; return; }
      renderResult(out, await r.json());
    } catch (err) {
      out.innerHTML = `<span class="err">查詢失敗：${esc(err.message)}</span>`;
    }
  });
}

// 國小/國中 切換
document.addEventListener('change', (e) => {
  if (e.target.matches('input[name="kind"]')) {
    CURRENT_KIND = e.target.value;
    renderPolygons();
  }
});

// boot
initMap();
loadAllPolygons();
</script>
</body>
</html>
