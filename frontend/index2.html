<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>都更神探R · v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 預連線 Firebase 三家 origin（DNS + TLS 提早做），SDK / token 真用到時就少 ~300-1000ms 冷啟 -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <!-- 預載入 Firebase JS modules（auth_gate 真 import 時就 cache hit） -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>

  <!-- ⚡ Critical CSS inline：讓 bootstrap loader 在 HTML 一解析完就 render，
       不必等 fonts CSS / style2.css 來回。原本 render-blocking 造成「3-4 秒空白」-->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif; background: #fbf9f3; }
    #v2-bootstrap-loader {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(180deg, #fbf9f3 0%, #f5f0e3 100%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #v2-bootstrap-loader.v2-bootstrap-loader--hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .v2-bootstrap-loader__panel { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .v2-bootstrap-loader__logo {
      width: 80px; height: 80px; border-radius: 50%;
      box-shadow: 0 4px 20px rgba(199,138,0,0.18);
      animation: v2lp 1.6s ease-in-out infinite;
    }
    @keyframes v2lp { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:.92} }
    .v2-bootstrap-loader__spinner {
      width: 28px; height: 28px;
      border: 3px solid #e0d9c2; border-top-color: #c78a00; border-radius: 50%;
      animation: v2ls 0.85s linear infinite;
    }
    @keyframes v2ls { to { transform: rotate(360deg); } }
    .v2-bootstrap-loader__text { font-size: 14px; color: #8b7e5a; letter-spacing: 1px; }
  </style>

  <!-- Google Fonts 改成非阻塞：先以 print media 載入（不阻 render）→ 載完換 all 套用 -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"></noscript>

  <!-- style2.css 仍 render-blocking，但量級小（~80KB 同源），且 critical CSS 已涵蓋 loader -->
  <link rel="stylesheet" href="/static/style2.css?v=1" />
  <!-- Perf instrumentation：?perf=1 (or localStorage v2_perf=1) 顯示分階段時間表 -->
  <script>
    (function () {
      var navT = (performance.timing && performance.timing.navigationStart) || performance.timeOrigin || 0;
      var t0 = performance.now();   // 從這支 inline script 第一次執行算起
      var enabled = location.search.indexOf('perf=1') >= 0
                 || localStorage.getItem('v2_perf') === '1';
      window.__PERF = {
        marks: [],
        t0: t0,
        nav_start_abs: navT,
        enabled: enabled,
      };
      window.__perfMark = function (name, extra) {
        var t = performance.now() - t0;
        var entry = { name: name, t: Math.round(t * 10) / 10, extra: extra || null };
        window.__PERF.marks.push(entry);
        if (enabled) {
          console.log('[PERF +' + entry.t.toFixed(1) + 'ms]', name, extra || '');
        }
      };
      window.__perfMark('html_inline_script_run', { ms_since_nav: Math.round(performance.now()) });
      document.addEventListener('DOMContentLoaded', function () { window.__perfMark('DOMContentLoaded'); });
      window.addEventListener('load', function () { window.__perfMark('window_load'); });
    })();
  </script>
  <!-- Early data fetch：用上次存的 cached token 在 Firebase SDK 還沒載入前就 fire central_search，
       平行壓掉 ~1.5 秒等 onAuthStateChanged 的時間。Token 過期/缺失 → app2.js 自然 fallback。 -->
  <script>
    (function () {
      try {
        var tok = localStorage.getItem('v2_cached_token');
        var exp = +localStorage.getItem('v2_cached_token_exp') || 0;
        var now = Date.now();
        var ageMin = exp ? Math.round((exp - now) / 60000) : null;
        // diagnostic marks（檢查 token state 為何沒走 early-fetch）
        if (!tok) {
          window.__perfMark && window.__perfMark('early_fetch_skip_no_token', {});
          return;
        }
        if (now > exp) {
          window.__perfMark && window.__perfMark('early_fetch_skip_expired', { age_min_remaining: ageMin });
          return;
        }
        window.__perfMark && window.__perfMark('early_fetch_token_ok', { age_min_remaining: ageMin, token_len: tok.length });
        // ⚠️ 必須跟 app2.js 的 V1_DISTRICTS.enabled (9 個) 一字不差，
        //    否則 server query cache key 不同 → 永遠 cache MISS
        //    app2.js: Object.values(V1_DISTRICTS).flatMap(cfg => cfg.enabled).join(',')
        var DISTRICTS = [
          '大安區','信義區','中山區','中正區','文山區',
          '新店區','永和區','中和區','板橋區'
        ];
        var url = '/api/central_search?slim=true&limit=1000&districts=' + encodeURIComponent(DISTRICTS.join(','));
        window.__perfMark && window.__perfMark('early_fetch_fire');
        window.__earlyDataPromise = fetch(url, { headers: { 'Authorization': 'Bearer ' + tok } })
          .then(function (r) {
            window.__perfMark && window.__perfMark('early_fetch_headers', { status: r.status });
            if (!r.ok) throw new Error('early_fetch_status_' + r.status);
            return r.json();
          })
          .then(function (data) {
            window.__perfMark && window.__perfMark('early_fetch_json_done', { items: (data.items||[]).length });
            return data;
          })
          .catch(function (e) {
            // 401 (token 過期) 或網路失敗：交還給 app2.js 走 fresh-token fallback
            window.__perfMark && window.__perfMark('early_fetch_fallback', { err: String(e).slice(0,80) });
            return null;
          });
      } catch (_e) { /* localStorage 不可用 */ }
    })();
  </script>
  <script type="module" src="/static/auth_gate.js"></script>
</head>
<body class="v2">

      <div class="v2-useful-links__dropdown">

        <a href="https://bim.udd.gov.taipei/UDDPlanMap/" target="_blank" rel="noopener">台北市 開發審議地圖</a>

        <a href="https://luz.nlma.gov.tw/web/" target="_blank" rel="noopener">全國土地使用分區查詢</a>

      </div>
    </div>
    <div id="user-menu" class="v2-user" style="display:none">
      <img id="user-avatar" class="v2-user__avatar" alt="">
      <span id="user-email" class="v2-user__email"></span>
      <button class="v2-icon-btn" onclick="v2.logout()" title="登出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Main app shell -->
<div class="v2-shell">

  <!-- Left sidebar: filters (explore) / capture (watchlist) -->
  <aside class="v2-sidebar" id="v2-sidebar">
    <div class="v2-sidebar__inner">

      <!-- Tab switcher (兩個 tab 都看得到) -->
      <div class="v2-tabs">
        <button class="v2-tab v2-tab--active" data-view="explore" onclick="v2.switchView('explore')">
          <span class="v2-tab__icon">🔍</span>探索
        </button>
        <button class="v2-tab" data-view="watchlist" onclick="v2.switchView('watchlist')">
          <span class="v2-tab__icon">⭐</span>最愛
          <span class="v2-tab__count" id="v2-watchlist-count"></span>
        </button>
      </div>

      <!-- 最愛 tab：URL / Manual 分析 capture (sidebar 內) -->
      <div class="v2-sidebar-section v2-sidebar-section--watchlist" id="v2-sidebar-watchlist" style="display:none">

        <!-- 卡 1：貼網址分析 -->
        <div class="v2-cap">
          <div class="v2-cap__title">貼網址分析，並加入最愛</div>
          <input id="v2-scrape-url" type="url" class="v2-input v2-cap__input"
                 placeholder="591 / 永慶 / 信義 詳情頁 URL">
          <button id="v2-cap-scrape-btn" class="v2-btn v2-btn--primary v2-btn--block v2-cap__btn"
                  onclick="v2.triggerScrapeUrl()">送出分析</button>
          <div class="v2-cap__msg" id="v2-cap-scrape-msg"></div>
          <div class="v2-cap__hint">※ 支援 591 / 永慶 / 信義；分析完加入最愛</div>
        </div>

        <!-- 卡 2：地址分析 -->
        <div class="v2-cap">
          <div class="v2-cap__title">地址分析，並加入最愛</div>
          <div class="v2-cap__row">
            <label class="v2-cap__label">城市</label>
            <select id="v2-manual-city" class="v2-input v2-cap__field" onchange="v2.populateManualDistricts()">
              <option value="台北市">台北市</option>
              <option value="新北市">新北市</option>
            </select>
          </div>
          <div class="v2-cap__row">
            <label class="v2-cap__label">行政區</label>
            <select id="v2-manual-district" class="v2-input v2-cap__field"></select>
          </div>
          <div class="v2-cap__row v2-cap__row--full">
            <label class="v2-cap__label">地址</label>
            <input id="v2-manual-address" type="text" class="v2-input v2-cap__field"
                   placeholder="例如：景興路102巷14號">
          </div>
          <div class="v2-cap__row">
            <label class="v2-cap__label">建坪</label>
            <input id="v2-manual-bld" type="number" min="0" step="0.01"
                   class="v2-input v2-input--num v2-cap__field" placeholder="(選填)">
          </div>
          <div class="v2-cap__row">
            <label class="v2-cap__label">地坪</label>
            <input id="v2-manual-land" type="number" min="0" step="0.01"
                   class="v2-input v2-input--num v2-cap__field" placeholder="(選填)">
          </div>
          <div class="v2-cap__row">
            <label class="v2-cap__label">總價</label>
            <input id="v2-manual-price" type="number" min="0" step="50"
                   class="v2-input v2-input--num v2-cap__field" placeholder="萬 (選填)">
          </div>
          <button id="v2-cap-manual-btn" class="v2-btn v2-btn--primary v2-btn--block v2-cap__btn"
                  onclick="v2.triggerManualAnalyze()">送出分析</button>
          <div class="v2-cap__msg" id="v2-cap-manual-msg"></div>
          <div class="v2-cap__hint">※ 目前僅支援台北市與新北市地址</div>
        </div>

      </div>

      <!-- 探索 tab：filter 區 -->
      <div class="v2-sidebar-section v2-sidebar-section--explore" id="v2-sidebar-explore">

      <!-- 主動作按鈕：搜尋 + 重置（同一列，緊跟 tab 下方） -->
      <div class="v2-action-row">
        <button class="v2-btn v2-btn--primary" onclick="v2.runSearch()">🔍 重新搜尋</button>
        <button class="v2-btn v2-btn--ghost" onclick="v2.resetFilters()">重置</button>
      </div>

      <!-- Filter sections — defaults 全部對齊 v1 -->
      <div class="v2-filter-group">
        <label class="v2-filter-label">行政區</label>
        <div class="v2-chip-row" id="v2-district-chips"></div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">類型</label>
        <div class="v2-chip-row">
          <label class="v2-chip"><input type="checkbox" class="v2-filter-btype" value="公寓" checked onchange="v2.applyFilters()"><span>公寓</span></label>
          <label class="v2-chip v2-chip--disabled"><input type="checkbox" class="v2-filter-btype" value="透天厝" disabled><span>透天厝（未開放）</span></label>
        </div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">路名</label>
        <input class="v2-input" type="text" id="v2-road" placeholder="輸入路名搜尋" oninput="v2.applyFilters()">
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">總價（萬）</label>
        <div class="v2-range">
          <input class="v2-input v2-input--num" type="number" id="v2-price-min" min="0" step="100" value="0" oninput="v2.applyFilters()">
          <span class="v2-range__sep">–</span>
          <input class="v2-input v2-input--num" type="number" id="v2-price-max" min="0" step="100" value="5000" oninput="v2.applyFilters()">
        </div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">物件樓層</label>
        <div class="v2-chip-row" id="v2-floor-chips">
          <label class="v2-chip v2-chip--all"><input type="checkbox" id="v2-floor-all" checked onchange="v2.toggleAllFloors(this)"><span>全部</span></label>
          <label class="v2-chip"><input type="checkbox" value="B" checked data-floor onchange="v2.onFloorChange()"><span>B1</span></label>
          <label class="v2-chip"><input type="checkbox" value="1" checked data-floor onchange="v2.onFloorChange()"><span>1</span></label>
          <label class="v2-chip"><input type="checkbox" value="2" checked data-floor onchange="v2.onFloorChange()"><span>2</span></label>
          <label class="v2-chip"><input type="checkbox" value="3" checked data-floor onchange="v2.onFloorChange()"><span>3</span></label>
          <label class="v2-chip"><input type="checkbox" value="4" checked data-floor onchange="v2.onFloorChange()"><span>4</span></label>
          <label class="v2-chip"><input type="checkbox" value="5" checked data-floor onchange="v2.onFloorChange()"><span>5</span></label>
        </div>
      </div>

      <div class="v2-filter-group v2-filter-group--num-compact">
        <label class="v2-filter-label">數字條件</label>
        <!-- 第 1 列：建單價 + 地單價 並排 -->
        <div class="v2-num-row v2-num-row--compact v2-num-row--pair">
          <span class="v2-num-row__label">建&lt;</span>
          <input class="v2-input v2-input--num v2-input--xs" type="number" id="v2-bld-price-max" min="0" step="5" value="300" oninput="v2.applyFilters()">
          <span class="v2-num-row__sep"></span>
          <span class="v2-num-row__label">地&lt;</span>
          <input class="v2-input v2-input--num v2-input--xs" type="number" id="v2-land-price-max" min="0" step="10" value="600" oninput="v2.applyFilters()">
          <span class="v2-num-row__suffix">萬/坪</span>
        </div>
        <!-- 第 2 列：地坪 ≥ (input 正常大小) -->
        <div class="v2-num-row v2-num-row--compact">
          <span class="v2-num-row__label">地坪≥</span>
          <input class="v2-input v2-input--num" type="number" id="v2-land-min" min="0" step="1" value="0" oninput="v2.applyFilters()">
          <span class="v2-num-row__suffix">坪</span>
        </div>
      </div>

      <!-- 隱藏抗性物件 — defaults 對齊 v1：5F+/B 不勾(顯示)、偏遠/特殊/法拍勾(隱藏) -->
      <!-- 5 個 toggle 排成 3 欄 grid (2 列、最後一格空) -->
      <div class="v2-filter-group">
        <label class="v2-filter-label">隱藏抗性物件</label>
        <div class="v2-toggle-grid">
          <label class="v2-toggle"><input type="checkbox" id="v2-hide-floors5plus" onchange="v2.applySort()"><span>五樓蓋+</span></label>
          <label class="v2-toggle"><input type="checkbox" id="v2-hide-remote" checked onchange="v2.applySort()"><span>偏遠</span></label>
          <label class="v2-toggle"><input type="checkbox" id="v2-hide-unsuitable" checked onchange="v2.applySort()"><span>特殊土地</span></label>
          <label class="v2-toggle"><input type="checkbox" id="v2-hide-basement" onchange="v2.applySort()"><span>地下室</span></label>
          <label class="v2-toggle"><input type="checkbox" id="v2-hide-foreclosure" onchange="v2.applySort()"><span>法拍</span></label>
        </div>
      </div>

        <div class="v2-min-mult-row">
          <label class="v2-toggle v2-toggle--inline">
            <input type="checkbox" id="v2-min-mult-on" onchange="v2.applySort()">
            <span>僅顯示獲利倍數</span>
          </label>
          <input class="v2-input v2-input--num" type="number" id="v2-min-mult-val" min="0" step="0.1" value="3.0" oninput="v2.applySort()">
          <span class="v2-num-row__suffix">倍以上</span>
        </div>

      </div><!-- /v2-sidebar-section--explore -->

  <!-- Main content area -->

    <!-- Mobile-only city tab switcher (≤1024px 才顯示) -->

      <button class="v2-grid-toggle__pill v2-grid-toggle__pill--active" data-city="台北市" onclick="v2.switchGridCity('台北市')">台北市</button>
      <button class="v2-grid-toggle__pill" data-city="新北市" onclick="v2.switchGridCity('新北市')">新北市</button>
    </div>

    <!-- Toolbar above grid -->
    <div class="v2-toolbar">
      <div class="v2-toolbar__left">
        <span class="v2-result-count" id="v2-result-count">— 筆</span>

          <option value="profit_multiple">獲利倍數</option>
          <option value="price_per_building_ping">建坪單價</option>
          <option value="price_per_land_ping">地坪單價</option>

  </main>

  <!-- Right drawer: detail panel -->
  <aside class="v2-drawer" id="v2-drawer">
    <div class="v2-drawer__header">
      <button class="v2-drawer__back" onclick="v2.closeDetail()" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="v2-drawer__back-label">返回</span>
      </button>
      <button class="v2-drawer__fav" id="v2-drawer-fav" style="display:none" onclick="v2.toggleDetailWatchlist()">
        <span class="v2-drawer__fav-star">★</span>
        <span class="v2-drawer__fav-label">加入最愛</span>
      </button>
      <div class="v2-drawer__sources" id="v2-drawer-sources" style="display:none"></div>
      <span class="v2-drawer__title" id="v2-drawer-title" style="display:none"></span>
    </div>
    <div class="v2-drawer__body" id="v2-drawer-body"></div>
  </aside>
  <div class="v2-drawer-backdrop" id="v2-drawer-backdrop" onclick="v2.closeDetail()"></div>

</div>

<!-- Toast container -->
<div class="v2-toast-host" id="v2-toast-host"></div>

<!-- shared.js: v1/v2 共用算式 — 必須在 app2.js 之前 -->
<script src="/static/shared.js"></script>
<script src="/static/app2.js?v=1"></script>
</body>
</html>
