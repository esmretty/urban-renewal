<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>都更神探R · v2</title>
  <!-- 頁籤 icon (favicon) — 用 logo.png；瀏覽器自己縮 -->
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="apple-touch-icon" href="/static/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 預連線 Firebase auth API origin（SDK 已自打包同源，但 token 驗證仍打 Google） -->
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
  <!-- 預載入自打包同源 Firebase bundle (auth_gate.js 真 import 時 cache hit)
       ?v=1 會被 server 端用當前 git SHA 替換，避免 iOS PWA cache 舊版 -->
  <link rel="modulepreload" href="/static/firebase-bundle.js?v=1">

  <!-- ⚡ Critical CSS inline：讓 bootstrap loader 在 HTML 一解析完就 render，
       不必等 fonts CSS / style2.css 來回。原本 render-blocking 造成「3-4 秒空白」-->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft JhengHei', sans-serif; background: #fbf9f3; }
    #v2-bootstrap-loader {
      position: fixed; inset: 0; z-index: 99999;
      background: linear-gradient(180deg, #fbf9f3 0%, #f5f0e3 100%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    #v2-bootstrap-loader.v2-bootstrap-loader--hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .v2-bootstrap-loader__panel { display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .v2-bootstrap-loader__logo {
      /* 方形 padding 容器，logo 自身原比例 contain 不被切到 */
      width: 96px; height: 96px;
      padding: 8px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(199,138,0,0.18);
      object-fit: contain;
      animation: v2lp 1.6s ease-in-out infinite;
    }
    @keyframes v2lp { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.05);opacity:.92} }
    .v2-bootstrap-loader__spinner {
      width: 28px; height: 28px;
      border: 3px solid #e0d9c2; border-top-color: #c78a00; border-radius: 50%;
      animation: v2ls 0.85s linear infinite;
    }
    @keyframes v2ls { to { transform: rotate(360deg); } }
    .v2-bootstrap-loader__text { font-size: 14px; color: #8b7e5a; letter-spacing: 1px; }
  </style>

  <!-- Google Fonts 改成非阻塞：先以 print media 載入（不阻 render）→ 載完換 all 套用 -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
        media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"></noscript>

  <!-- Leaflet (地圖模式用，僅 retty.liu@gmail.com 可見入口；CSS 載這裡，JS 在 body 結尾) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- style2.css 仍 render-blocking，但量級小（~80KB 同源），且 critical CSS 已涵蓋 loader -->
  <link rel="stylesheet" href="/static/style2.css?v=1" />
  <!-- 地圖模式專用樣式 (跟 style2.css 分離；非 retty.liu@gmail.com 不會看到入口) -->
  <link rel="stylesheet" href="/static/map_mode.css?v=1" />
  <link rel="stylesheet" href="/static/map_overlays.css?v=1" />
  <!-- Perf instrumentation：?perf=1 (or localStorage v2_perf=1) 顯示分階段時間表 -->
  <script>
    (function () {
      var navT = (performance.timing && performance.timing.navigationStart) || performance.timeOrigin || 0;
      var t0 = performance.now();   // 從這支 inline script 第一次執行算起
      var enabled = location.search.indexOf('perf=1') >= 0
                 || localStorage.getItem('v2_perf') === '1';
      window.__PERF = {
        marks: [],
        t0: t0,
        nav_start_abs: navT,
        enabled: enabled,
      };
      window.__perfMark = function (name, extra) {
        var t = performance.now() - t0;
        var entry = { name: name, t: Math.round(t * 10) / 10, extra: extra || null };
        window.__PERF.marks.push(entry);
        if (enabled) {
          console.log('[PERF +' + entry.t.toFixed(1) + 'ms]', name, extra || '');
        }
      };
      window.__perfMark('html_inline_script_run', { ms_since_nav: Math.round(performance.now()) });
      document.addEventListener('DOMContentLoaded', function () { window.__perfMark('DOMContentLoaded'); });
      window.addEventListener('load', function () { window.__perfMark('window_load'); });
    })();
  </script>
  <!-- Early data fetch：用上次存的 cached token 在 Firebase SDK 還沒載入前就 fire central_search，
       平行壓掉 ~1.5 秒等 onAuthStateChanged 的時間。Token 過期/缺失 → app2.js 自然 fallback。 -->
  <script>
    (function () {
      try {
        var tok = localStorage.getItem('v2_cached_token');
        var exp = +localStorage.getItem('v2_cached_token_exp') || 0;
        var now = Date.now();
        var ageMin = exp ? Math.round((exp - now) / 60000) : null;
        // diagnostic marks（檢查 token state 為何沒走 early-fetch）
        if (!tok) {
          window.__perfMark && window.__perfMark('early_fetch_skip_no_token', {});
          return;
        }
        if (now > exp) {
          window.__perfMark && window.__perfMark('early_fetch_skip_expired', { age_min_remaining: ageMin });
          return;
        }
        window.__perfMark && window.__perfMark('early_fetch_token_ok', { age_min_remaining: ageMin, token_len: tok.length });
        // ⚠️ 必須跟 app2.js 的 V1_DISTRICTS.enabled (9 個) 一字不差，
        //    否則 server query cache key 不同 → 永遠 cache MISS
        //    app2.js: Object.values(V1_DISTRICTS).flatMap(cfg => cfg.enabled).join(',')
        var DISTRICTS = [
          '大安區','信義區','中山區','中正區','文山區',
          '新店區','永和區','中和區','板橋區'
        ];
        var url = '/api/central_search?slim=true&limit=50000&districts=' + encodeURIComponent(DISTRICTS.join(','));
        window.__perfMark && window.__perfMark('early_fetch_fire');
        window.__earlyDataPromise = fetch(url, { headers: { 'Authorization': 'Bearer ' + tok } })
          .then(function (r) {
            window.__perfMark && window.__perfMark('early_fetch_headers', { status: r.status });
            if (!r.ok) throw new Error('early_fetch_status_' + r.status);
            return r.json();
          })
          .then(function (data) {
            window.__perfMark && window.__perfMark('early_fetch_json_done', { items: (data.items||[]).length });
            return data;
          })
          .catch(function (e) {
            // 401 (token 過期) 或網路失敗：交還給 app2.js 走 fresh-token fallback
            window.__perfMark && window.__perfMark('early_fetch_fallback', { err: String(e).slice(0,80) });
            return null;
          });
      } catch (_e) { /* localStorage 不可用 */ }
    })();
  </script>
  <script type="module" src="/static/auth_gate.js?v=1"></script>
</head>

        <label class="v2-filter-label">篩選都更案件</label>
        <div class="v2-redev-filter-cols">
          <div class="v2-redev-filter-col">
            <div class="v2-redev-filter-col__title">台北市</div>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="pub_renew" onchange="v2.applySort()"><span>公劃更新</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="self_announce" onchange="v2.applySort()"><span>公告自劃</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="self_approved" onchange="v2.applySort()"><span>核准自劃</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="planned" onchange="v2.applySort()"><span>都計劃定</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="115_revised" onchange="v2.applySort()"><span>115年修訂</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="chloride" onchange="v2.applySort()"><span>高氯離子</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="pub_business" onchange="v2.applySort()"><span>公劃內事業</span></label>
          </div>
          <div class="v2-redev-filter-col">
            <div class="v2-redev-filter-col__title">新北市</div>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="ama" onchange="v2.applySort()"><span>都更事業</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="easy" onchange="v2.applySort()"><span>簡易都更</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="danger" onchange="v2.applySort()"><span>危老重建</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="amdm" onchange="v2.applySort()"><span>防災案件</span></label>
            <label class="v2-toggle"><input type="checkbox" data-redev-filter="rzoning" onchange="v2.applySort()"><span>劃定更新地區</span></label>
          </div>
        </div>
      </div>

      </div><!-- /v2-sidebar-section--explore -->
    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="v2-sidebar-backdrop" id="v2-sidebar-backdrop" onclick="v2.closeSidebar()"></div>
  <!-- 手機側欄關閉按鈕：固定在 sidebar 右邊中央，sidebar 開啟才顯示 -->
  <button type="button" class="v2-sidebar__close" id="v2-sidebar-close"
          onclick="v2.closeSidebar()" aria-label="關閉側欄" title="關閉側欄">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <!-- Main content area -->
  <main class="v2-main">

    <!-- Mobile-only city tab switcher (≤1024px 才顯示) -->
    <div class="v2-grid-toggle" id="v2-grid-toggle">
      <button class="v2-grid-toggle__pill v2-grid-toggle__pill--active" data-city="台北市" onclick="v2.switchGridCity('台北市')">台北市</button>
      <button class="v2-grid-toggle__pill" data-city="新北市" onclick="v2.switchGridCity('新北市')">新北市</button>
    </div>

    <!-- Toolbar above grid -->
    <div class="v2-toolbar">
      <div class="v2-toolbar__left">
        <span class="v2-result-count" id="v2-result-count">— 筆</span>
        <button class="v2-icon-btn v2-result-reload" aria-label="重新整理" onclick="v2.hardReload()" title="重新整理（清快取）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
          </svg>
        </button>
      </div>
      <div class="v2-toolbar__right">
        <!-- 列表 / 地圖 切換（PC 顯示文字，mobile 顯示 icon — CSS 控制） -->
        <div class="v2-view-toggle" id="v2-view-toggle">
          <a href="#" class="v2-view-toggle__link is-active" data-view-mode="list"
             onclick="event.preventDefault(); v2.setViewMode('list')" aria-label="列表模式" title="列表模式">
            <svg class="v2-view-toggle__icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span class="v2-view-toggle__txt">列表模式</span>
          </a>
          <span class="v2-view-toggle__sep">|</span>
          <a href="#" class="v2-view-toggle__link" data-view-mode="map"
             onclick="event.preventDefault(); v2.setViewMode('map')" aria-label="地圖模式" title="地圖模式">
            <svg class="v2-view-toggle__icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
              <line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/>
            </svg>
            <span class="v2-view-toggle__txt">地圖模式</span>
          </a>
        </div>
        <!-- 8 排序選項對齊 v1，預設「新進優先」+ 降冪 -->
        <select class="v2-select" id="v2-sort" onchange="v2.applySort()">
          <option value="list_rank" selected>新進優先</option>
          <option value="last_change_at">物件有變動</option>
          <option value="published_at">原網刊登時間</option>
          <option value="profit_multiple">獲利倍數</option>
          <option value="price_per_building_ping">建坪單價</option>
          <option value="price_per_land_ping">地坪單價</option>
          <option value="price_ntd">總價</option>
          <option value="building_age">屋齡</option>
        </select>
        <button class="v2-btn v2-btn--ghost v2-btn--sm" id="v2-sort-dir" onclick="v2.toggleSortDir()" title="升冪/降冪">↓</button>
      </div>
    </div>

    <!-- Card grid -->
    <div class="v2-grid" id="v2-grid">
      <!-- skeleton placeholder injected by JS -->
    </div>

    <!-- 地圖容器（地圖模式才 show） -->
    <div id="v2-map-wrap" class="v2-map-wrap" style="display:none">
      <div class="v2-map-toolbar">
        <span class="v2-map-toolbar__label">學區圖層：</span>
        <label class="v2-map-toolbar__radio"><input type="radio" name="v2-school-layer" value="off" checked> 無</label>
        <label class="v2-map-toolbar__radio"><input type="radio" name="v2-school-layer" value="elementary"> 國小</label>
        <label class="v2-map-toolbar__radio"><input type="radio" name="v2-school-layer" value="junior_high"> 國中</label>
        <span class="v2-map-toolbar__hint" id="v2-school-layer-hint"></span>
      </div>
      <!-- 地籍圖層 toolbar — 內容由 map_overlays.js 動態 render -->
      <div id="v2-map-overlays-toolbar" class="v2-map-overlays-toolbar"></div>
      <!-- 都更圖層 toolbar — 10 個 sub-checkbox 對齊 UDDPlanMap -->
      <div id="v2-map-renewal-toolbar" class="v2-map-renewal-toolbar"></div>
      <!-- SVG filter defs — 把 GeoServer grayscale tile 染成 UDDPlanMap fillcolor。
           server zonegeo 不接受 SLD_BODY，必須前端 colorize。原 image alpha=255 像素都
           被 flood 成指定色 + alpha 保留 → 透明區仍透明，灰色塊變彩色塊 -->
      <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
          <filter id="redev-flt-pub_renew"><feFlood flood-color="#FF0000"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-self_announce"><feFlood flood-color="#0000FF"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-self_approved"><feFlood flood-color="#FF7F00"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-planned"><feFlood flood-color="#FF00FF"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-115_revised"><feFlood flood-color="#FF9966"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-chloride"><feFlood flood-color="#D0B17A"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-63y_building"><feFlood flood-color="#1F4E79"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-urgent"><feFlood flood-color="#FFD0FF"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-pub_business"><feFlood flood-color="#6495ED"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-invalid"><feFlood flood-color="#00FFFF"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-ntpc_ama"><feFlood flood-color="#FF7F00"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-ntpc_easy"><feFlood flood-color="#0066CC"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-ntpc_danger"><feFlood flood-color="#FF0000"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-ntpc_amdm"><feFlood flood-color="#9933CC"/><feComposite in2="SourceAlpha" operator="in"/></filter>
          <filter id="redev-flt-ntpc_rzoning"><feFlood flood-color="#008080"/><feComposite in2="SourceAlpha" operator="in"/></filter>
        </defs>
      </svg>
      <div id="v2-map" class="v2-map"></div>
    </div>

    <!-- Empty state -->
    <div class="v2-empty" id="v2-empty" style="display:none">
      <div class="v2-empty__icon">📭</div>
      <div class="v2-empty__text">沒有符合條件的物件</div>
      <div class="v2-empty__hint">試試放寬條件或重置</div>
    </div>

    <!-- Pagination -->
    <div class="v2-pagination" id="v2-pagination"></div>

  </main>

  <!-- Right drawer: detail panel -->
  <aside class="v2-drawer" id="v2-drawer">
    <div class="v2-drawer__header">
      <button class="v2-drawer__back" onclick="v2.closeDetail()" aria-label="返回">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span class="v2-drawer__back-label">返回</span>
      </button>
      <button class="v2-drawer__fav" id="v2-drawer-fav" style="display:none" onclick="v2.toggleDetailWatchlist()">
        <span class="v2-drawer__fav-star">☆</span>
        <span class="v2-drawer__fav-label">加入最愛</span>
        <span class="v2-drawer__fav-shortlabel">最愛</span>
      </button>
      <button class="v2-drawer__map" id="v2-drawer-map" style="display:none"
        onclick="v2.viewOnMap()" aria-label="在地圖上查看" title="在地圖上查看">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        <span class="v2-drawer__map-label">地圖</span>
      </button>
      <button class="v2-drawer__share" id="v2-drawer-share" style="display:none"
        onclick="v2.shareDetail()" aria-label="分享此頁" title="分享此頁">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="11.49"/>
        </svg>
        <span class="v2-drawer__share-label">分享</span>
      </button>
      <div class="v2-drawer__sources" id="v2-drawer-sources" style="display:none"></div>
      <span class="v2-drawer__title" id="v2-drawer-title" style="display:none"></span>
    </div>
    <div class="v2-drawer__body" id="v2-drawer-body"></div>
  </aside>
  <div class="v2-drawer-backdrop" id="v2-drawer-backdrop" onclick="v2.closeDetail()"></div>

</div>

<!-- Toast container -->
<div class="v2-toast-host" id="v2-toast-host"></div>

<!-- Leaflet JS (地圖模式用) — 放在 app2.js 之前確保 L 全域可用 -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- shared.js: v1/v2 共用算式 — 必須在 app2.js 之前 -->
<script src="/static/shared.js?v=1"></script>
<script src="/static/app2.js?v=1"></script>
<!-- map_mode.js: 地圖模式獨立模組（透過 window.v2 attach；必須在 app2.js 之後） -->
<script src="/static/map_mode.js?v=1"></script>
<!-- map_overlays.js: optional 圖層（地籍/分區/都更）— 隔離 module，必須在 map_mode.js 之後 -->
<script src="/static/map_overlays.js?v=1"></script>
</body>
</html>
