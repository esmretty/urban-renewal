<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>都更神探R · v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/style2.css?v=1" />
  <script type="module" src="/static/auth_gate.js"></script>
</head>
<body class="v2">

<!-- Top bar -->
<header class="v2-topbar">
  <div class="v2-topbar__left">
    <button class="v2-icon-btn v2-only-mobile" id="v2-menu-btn" aria-label="選單">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="v2-brand" href="/v2">
      <img src="/static/logo.png" alt="" class="v2-brand__logo">
      <span class="v2-brand__name">都更神探R</span>
      <span class="v2-brand__version">v2</span>
    </a>
  </div>
  <div class="v2-topbar__right">
    <a class="v2-text-btn" href="/" title="回到舊版">舊版 →</a>
    <div id="user-menu" class="v2-user" style="display:none">
      <img id="user-avatar" class="v2-user__avatar" alt="">
      <span id="user-email" class="v2-user__email"></span>
      <button class="v2-icon-btn" onclick="v2.logout()" title="登出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- Main app shell -->
<div class="v2-shell">

  <!-- Left sidebar: filters -->
  <aside class="v2-sidebar" id="v2-sidebar">
    <div class="v2-sidebar__inner">

      <!-- Tab switcher -->
      <div class="v2-tabs">
        <button class="v2-tab v2-tab--active" data-view="explore" onclick="v2.switchView('explore')">
          <span class="v2-tab__icon">🔍</span>探索
        </button>
        <button class="v2-tab" data-view="watchlist" onclick="v2.switchView('watchlist')">
          <span class="v2-tab__icon">⭐</span>觀察清單
          <span class="v2-tab__count" id="v2-watchlist-count"></span>
        </button>
      </div>

      <!-- Filter sections -->
      <div class="v2-filter-group">
        <label class="v2-filter-label">行政區</label>
        <div class="v2-chip-row" id="v2-district-chips"></div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">路名</label>
        <input class="v2-input" type="text" id="v2-road" placeholder="輸入路名搜尋" oninput="v2.applyFilters()">
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">總價（萬）</label>
        <div class="v2-range">
          <input class="v2-input v2-input--num" type="number" id="v2-price-min" min="0" step="100" value="0" oninput="v2.applyFilters()">
          <span class="v2-range__sep">–</span>
          <input class="v2-input v2-input--num" type="number" id="v2-price-max" min="0" step="100" value="5000" oninput="v2.applyFilters()">
        </div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">物件樓層</label>
        <div class="v2-chip-row" id="v2-floor-chips">
          <label class="v2-chip"><input type="checkbox" value="1" checked onchange="v2.applyFilters()"><span>1F</span></label>
          <label class="v2-chip"><input type="checkbox" value="2" checked onchange="v2.applyFilters()"><span>2F</span></label>
          <label class="v2-chip"><input type="checkbox" value="3" checked onchange="v2.applyFilters()"><span>3F</span></label>
          <label class="v2-chip"><input type="checkbox" value="4" checked onchange="v2.applyFilters()"><span>4F</span></label>
          <label class="v2-chip"><input type="checkbox" value="5" checked onchange="v2.applyFilters()"><span>5F</span></label>
        </div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">數字條件</label>
        <div class="v2-num-row">
          <span class="v2-num-row__label">建單價&lt;</span>
          <input class="v2-input v2-input--num" type="number" id="v2-bld-price-max" min="0" step="5" value="300" oninput="v2.applyFilters()">
          <span class="v2-num-row__suffix">萬/坪</span>
        </div>
        <div class="v2-num-row">
          <span class="v2-num-row__label">地單價&lt;</span>
          <input class="v2-input v2-input--num" type="number" id="v2-land-price-max" min="0" step="10" value="600" oninput="v2.applyFilters()">
          <span class="v2-num-row__suffix">萬/坪</span>
        </div>
        <div class="v2-num-row">
          <span class="v2-num-row__label">地坪≥</span>
          <input class="v2-input v2-input--num" type="number" id="v2-land-min" min="0" step="1" value="0" oninput="v2.applyFilters()">
          <span class="v2-num-row__suffix">坪</span>
        </div>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">隱藏抗性物件</label>
        <label class="v2-toggle"><input type="checkbox" id="v2-hide-floors5plus" onchange="v2.applyFilters()"><span>五樓蓋以上</span></label>
        <label class="v2-toggle"><input type="checkbox" id="v2-hide-remote" checked onchange="v2.applyFilters()"><span>偏遠路段</span></label>
        <label class="v2-toggle"><input type="checkbox" id="v2-hide-unsuitable" checked onchange="v2.applyFilters()"><span>特殊土地</span></label>
        <label class="v2-toggle"><input type="checkbox" id="v2-hide-basement" checked onchange="v2.applyFilters()"><span>地下室</span></label>
        <label class="v2-toggle"><input type="checkbox" id="v2-hide-foreclosure" checked onchange="v2.applyFilters()"><span>法拍屋</span></label>
      </div>

      <div class="v2-filter-group">
        <label class="v2-filter-label">最低倍數</label>
        <div class="v2-range">
          <input class="v2-input v2-input--num" type="number" id="v2-min-multiple" min="0" step="0.1" value="0" oninput="v2.applyFilters()">
          <span class="v2-num-row__suffix">倍</span>
        </div>
      </div>

      <button class="v2-btn v2-btn--primary v2-btn--block" onclick="v2.runSearch()">
        🔍 開始搜尋
      </button>
      <button class="v2-btn v2-btn--ghost v2-btn--block" onclick="v2.resetFilters()">重置條件</button>

    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="v2-sidebar-backdrop" id="v2-sidebar-backdrop" onclick="v2.closeSidebar()"></div>

  <!-- Main content area -->
  <main class="v2-main">

    <!-- Toolbar above grid -->
    <div class="v2-toolbar">
      <div class="v2-toolbar__left">
        <span class="v2-result-count" id="v2-result-count">— 筆</span>
      </div>
      <div class="v2-toolbar__right">
        <select class="v2-select" id="v2-sort" onchange="v2.applySort()">
          <option value="multiple_desc">倍數 高→低</option>
          <option value="multiple_asc">倍數 低→高</option>
          <option value="price_asc">總價 低→高</option>
          <option value="price_desc">總價 高→低</option>
          <option value="age_desc">屋齡 老→新</option>
          <option value="land_desc">地坪 大→小</option>
          <option value="published_desc">上架時間 新→舊</option>
        </select>
      </div>
    </div>

    <!-- Card grid -->
    <div class="v2-grid" id="v2-grid">
      <!-- skeleton placeholder injected by JS -->
    </div>

    <!-- Empty state -->
    <div class="v2-empty" id="v2-empty" style="display:none">
      <div class="v2-empty__icon">📭</div>
      <div class="v2-empty__text">沒有符合條件的物件</div>
      <div class="v2-empty__hint">試試放寬條件或重置</div>
    </div>

    <!-- Pagination -->
    <div class="v2-pagination" id="v2-pagination"></div>

  </main>

  <!-- Right drawer: detail panel -->
  <aside class="v2-drawer" id="v2-drawer">
    <div class="v2-drawer__header">
      <button class="v2-icon-btn" onclick="v2.closeDetail()" aria-label="關閉">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
      <span class="v2-drawer__title" id="v2-drawer-title">物件詳情</span>
    </div>
    <div class="v2-drawer__body" id="v2-drawer-body"></div>
  </aside>
  <div class="v2-drawer-backdrop" id="v2-drawer-backdrop" onclick="v2.closeDetail()"></div>

</div>

<!-- Toast container -->
<div class="v2-toast-host" id="v2-toast-host"></div>

<script src="/static/app2.js?v=1"></script>
</body>
</html>
